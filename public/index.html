<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Guestbook</h1>

    <form id="form">
      <input id="author" placeholder="Your name" maxlength="100" required>
      <textarea id="message" rows="3" placeholder="Your message" maxlength="2000" required></textarea>
      <button type="submit">Sign the guestbook</button>
    </form>
    <p id="error" hidden></p>

    <ul id="entries"></ul>
    <p id="empty" hidden>No entries yet — be the first to sign!</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
